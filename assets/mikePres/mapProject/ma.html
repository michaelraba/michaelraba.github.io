<style>
  .map-controls {
    display: flex;
    flex-direction: row;
    gap: 1em;
    align-items: flex-start;
  }
  .side-buttons {
    display: flex;
    flex-direction: column;
    gap: 0.5em;
  }
  .svg-container {
    flex: 1;
    position: relative;
  }
  .bottom-buttons {
    display: flex;
    justify-content: center;
    gap: 1em;
    margin-top: 1em;
  }
</style>

<div class="map-controls">
  <!-- Left side superlayer buttons -->
  <div class="side-buttons">
    <button onclick="activateLayer('hDesk')">hDesk</button>
    <button onclick="activateLayer('a1Desk')">a1Desk</button>
  </div>

  <!-- SVG viewer -->
  <div class="svg-container">
    <object id="mapObj" type="image/svg+xml" data="./svg.svg" width="100%" height="600px">
      Your browser does not support SVG.
    </object>
  </div>
</div>

<!-- Bottom row sublayer buttons -->
<div class="bottom-buttons">
  <button onclick="showSub('PET')">PET</button>
  <button onclick="showSub('Gill')">Gill</button>
  <button onclick="showSub('Dentistry')">Dentistry</button>
  <button onclick="showSub('CC')">CC</button>
</div>

<script>
  let svgDoc = null;
  let superlayers = {};
  let currentSuperlayerId = 'hDesk';

  document.addEventListener("DOMContentLoaded", () => {
    const obj = document.getElementById("mapObj");

    obj.addEventListener("load", () => {
      svgDoc = obj.contentDocument;

      // Get references to both superlayers
      superlayers = {
        hDesk: svgDoc.getElementById("hDesk"),
        a1Desk: svgDoc.getElementById("a1Desk")
      };

      // Initially activate hDesk
      activateLayer("hDesk");
    });
  });

  function activateLayer(layerId) {
    currentSuperlayerId = layerId;

    for (const [id, group] of Object.entries(superlayers)) {
      if (!group) continue;
      group.style.display = (id === layerId) ? "inline" : "none";
    }
  }

  function showSub(subId) {
    const activeLayer = superlayers[currentSuperlayerId];
    if (!activeLayer) return;

    // Hide all direct children of the current superlayer
    Array.from(activeLayer.children).forEach(child => {
      if (child.style) child.style.display = "none";
    });

    // Try to show the specified sublayer
    const sub = svgDoc.getElementById(subId);
    if (sub && activeLayer.contains(sub)) {
      sub.style.display = "inline";
      sub.querySelectorAll("*").forEach(el => {
        if (el.style) el.style.display = "inline";
      });
    } else {
      console.warn(`Sublayer "${subId}" not found in "${currentSuperlayerId}"`);
    }
  }
</script>
